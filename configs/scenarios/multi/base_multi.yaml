scenario:
  name: base_multi
  hypothesis: null


simulation: {seed: 42, max_sim_time: 5000.0, piece_size_mb: 2.0, transfer_timeout: 20.0, tick_interval: 1.0, move_interval: 1.0}  # piece size is megabytes
topology: {directions: [N, E, S, W], horizon: 1000}
radio: {mode: fixed, fixed: {c_max: 40.0, d0: 2000.0, gamma: 2.0}} # c_max is megabits
heterogeneity: {mode: "n_slow", n_slow: 0, p_slow: 0.0, slow_factor: 0.9} # no slow peers

agents:
  seeders:
    - {direction: N}
    - {direction: E}
    - {direction: S}
    - {direction: W}
  peers:
    - {count: 4, target: [N, E, S, W], strategy: rarest_random}