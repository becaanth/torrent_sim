scenario:
  name: base_convoy
  hypothesis: null

simulation: {seed: 42, max_sim_time: 10000.0, piece_size_mb: 2.0, transfer_timeout: 20.0, tick_interval: 1.0, move_interval: 1.0}  # piece size is megabytes
topology: {directions: [E], horizon: 2000}
churn: {p_bad: 0.0, mean_up: 15.0, mean_down: 5.0}
radio: {mode: fixed, fixed: {c_max: 40.0, d0: 800.0, gamma: 2.0}} # c_max is megabits
heterogeneity: {mode: "n_slow", n_slow: 1, p_slow: 0.0, slow_factor: 0.9}

agents:
  seeders:
    - {direction: E}
  peers:
    - {count: 4, target: [E, E, E, E], strategy: rarest_random} # small fleet