scenario:
  name: base_scenario
  description: >
    Neutral base environment for comparing pickers head-to-head via
    --compare-strategies. The `strategy` field below is a placeholder --
    it gets overridden per variant, so its value here doesn't matter.
  hypothesis: null

simulation:
  seed: 42
  max_sim_time: 2000.0
  tick_interval: 2.0
  move_interval: 1.5

topology:
  directions: [N, E, S, W]
  horizon: 15

churn:
  p_bad: 0.2
  mean_up: 15.0
  mean_down: 5.0

radio:
  mode: fixed
  fixed: {c_max: 10.0, d0: 100.0, gamma: 2.0}

agents:
  seeders:
    - {direction: N}
    - {direction: E}
    - {direction: S}
    - {direction: W}
  peers:
    - {count: 8, target: [N, E, S, W], strategy: rarest_random}