scenario:
  name: base_convoy
  hypothesis: null

simulation: {seed: 42, max_sim_time: 200.0, tick_interval: 2.0, move_interval: 1.5}
# topology: {directions: [N, E, S, W], horizon: 500}
topology: {directions: [E], horizon: 100} # really long horizon so each trial takes full time
churn: {p_bad: 0.0}
radio: {mode: fixed, fixed: {c_max: 10.0, d0: 20.0, gamma: 2.0}}

agents:
  seeders:
    - {direction: E}
  peers:
    - {count: 4, target: [E, E, E, E], strategy: rarest_random}